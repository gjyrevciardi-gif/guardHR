name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ng
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ngtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ng" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL (schema built by Alembic, includes migration tests)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ng:test@localhost:5432/ngtest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate development and production compose files
        run: |
          docker compose -f docker-compose.yml config -q
          POSTGRES_PASSWORD=x JWT_SECRET=$(openssl rand -hex 32) SECRETS_ENCRYPTION_KEY=x INITIAL_ADMIN_PASSWORD=x PUBLIC_APP_URL=https://hr.example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          TURN_SECRET=x POSTGRES_PASSWORD=x JWT_SECRET=$(openssl rand -hex 32) SECRETS_ENCRYPTION_KEY=x INITIAL_ADMIN_PASSWORD=x PUBLIC_APP_URL=https://hr.example.com \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile turn config -q
          for script in deploy/*.sh; do sh -n "$script"; done
