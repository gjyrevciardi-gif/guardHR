name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # One admin for the whole job: the API seeds it, the test logs in as it. Development mode, SQLite.
      INITIAL_ADMIN_EMAIL: e2e@example.com
      INITIAL_ADMIN_PASSWORD: E2e-Pass-123!
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: E2e-Pass-123!
      DATABASE_URL: sqlite:///./e2e.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.seed
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8100 > ../api.log 2>&1 &

      - name: Build and start the frontend (the standalone server the Docker image runs)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/static
          PORT=3100 nohup node .next/standalone/server.js > ../web.log 2>&1 &

      - name: Wait for both
        run: |
          for url in http://127.0.0.1:8100/api/health http://localhost:3100/login; do
            for _ in $(seq 1 60); do curl -fsS -o /dev/null "$url" && break; sleep 1; done
            curl -fsS -o /dev/null "$url"
          done

      # The Chrome that ships on the runner image: no browser download and no apt packages (that step once took three
      # minutes on a slow mirror). Playwright talks to whatever stable Chrome the image has.
      - name: Smoke test
        working-directory: frontend
        env:
          PW_CHANNEL: chrome
        run: |
          google-chrome --version
          npm run e2e

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            api.log
            web.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
