version: 2

# Weekly, and grouped so a normal week is one pull request per ecosystem, not twenty. Major versions stay separate
# on purpose: they need reading. CI (ci.yml, e2e.yml, security.yml) decides whether a bump is safe to merge.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly

  # The images named in the compose files: postgres, nginx, coturn, mailpit.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
