# coturn for NemoGuardHR (docs/staging.md). The shared secret comes from TURN_SECRET on the command line, never from this file.
# The backend turns the same secret into short-lived credentials (GET /api/rtc-config), so nothing here is a password.

realm=nemoguard
use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Open in the firewall: 3478 udp+tcp, 5349 tcp (turns:), and the relay range below (udp).
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

# Same certificate as the proxy (mounted at /certs). Its hostname must be the one in TURN_URLS.
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem

# Behind a 1:1 NAT (AWS, GCP, Azure): uncomment and set PUBLIC/PRIVATE.
# external-ip=203.0.113.10/10.0.0.5
# If the server's own address is private (also those clouds), calls where BOTH people relay need it allowed again:
# allowed-peer-ip=10.0.0.5

# A relay must never reach into private networks: otherwise anyone with a call link could probe what sits behind the firewall.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

# Credentials are public to anyone with a call link, so cap what they can take. Each relayed participant holds one port of
# the range above, so 40 allocations is the real ceiling; keep total-quota at or below the number of ports. Each is held to
# about 3 MB/s (a 720p video stream needs well under that). user-quota is per username, and every credential has its own.
user-quota=12
total-quota=40
max-bps=3000000
