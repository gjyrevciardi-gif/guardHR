# Production overlay:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Needs Docker Compose >= 2.24 (uses !reset). Only the Nginx proxy is exposed; see docs/deployment.md.
services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}

  backend:
    ports: !reset []
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-interviewguard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-interviewguard}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random value of at least 32 characters}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL, e.g. https://hr.example.com}
      CORS_ORIGINS: ${PUBLIC_APP_URL}
      TRUST_PROXY_HEADERS: "true" # safe only because nginx overwrites X-Forwarded-For
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
    restart: unless-stopped

  # Development-only mail catcher: configure a real SMTP_HOST instead.
  mailpit:
    profiles: ["dev"]

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      NEXT_PUBLIC_API_URL: /api
    ports: !reset []
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro # fullchain.pem + privkey.pem
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
