# Development stack. For production add docker-compose.prod.yml (see docs/deployment.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interviewguard}
      POSTGRES_USER: ${POSTGRES_USER:-interviewguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewguard_dev}
    volumes:
      - interviewguard_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interviewguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        # true = ship YOLO/OpenCV (phone / extra-person detection). false = smaller API-only image.
        INSTALL_CV: ${INSTALL_CV:-true}
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://interviewguard:interviewguard_dev@db:5432/interviewguard}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-now}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-hr@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-ChangeMe123!}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-}
      REQUIRE_ADMIN_MFA: ${REQUIRE_ADMIN_MFA:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RETENTION_PURGE_INTERVAL_HOURS: ${RETENTION_PURGE_INTERVAL_HOURS:-24}
      ABANDONED_SESSION_HOURS: ${ABANDONED_SESSION_HOURS:-12}
      ICE_SERVERS: ${ICE_SERVERS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-yolo11n.pt}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3100}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-NemoGuardHR <no-reply@nemoguard.test>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
    ports:
      - "${BACKEND_PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
        required: false

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100/api}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100/api}
      # Shown on /privacy (docs/deployment.md, "Privacy page"); read at request time, no rebuild needed.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
      OPERATOR_LEGAL_BASIS: ${OPERATOR_LEGAL_BASIS:-}
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
    depends_on:
      - backend

volumes:
  interviewguard_data:
